[window]
# A specific calendar date. Active service_ids are resolved from calendar.txt
# and calendar_dates.txt. Use a typical midday weekday (Tuesday or Wednesday,
# when school is in session, no public holidays).
date = "2026-07-15"
start_time = "10:00"   # HH:MM 24-hour. Times >= 24:00 are allowed (GTFS convention),
end_time   = "14:00"   # e.g. a late-evening window may be "22:00" - "26:00".

[metric]
# How to aggregate inter-trip gaps within the window. The window edges
# count as gaps (start -> first bus, last bus -> end), so the gaps tile
# the whole window and sparse stray trips can't read as frequent service.
# "max"       - longest gap (worst-case wait; one odd gap reclassifies the
#               span it falls in)
# "mean"      - arithmetic mean of all gaps, ~ window / (trips + 1)
# "median"    - time-weighted median: the gap in effect at the typical
#               minute of the window (robust to outliers without being
#               fooled by bunched trips in an empty window)
# "count"     - window duration / number of trips ("buses per hour";
#               most stable, ignores spacing entirely)
# "effective" - sum(g^2)/sum(g): average headway experienced by a randomly
#               arriving rider; equals the plain headway for even service,
#               degrades smoothly with bunching. Recommended.
type = "effective"

# Optional polish pass over each route's stop-to-stop spans.
# Remove the section (or set enabled = false) to disable.
[smoothing]
enabled = false
# Collapse a run of equal-bucket spans shorter than this (metres) when the
# runs on both sides agree with each other. Genuine changes (branch points,
# short turns) form long runs and survive.
min_run_m = 400
# Spans with no resolvable boundary stop on either end inherit a neighbor's
# bucket (the slower one if neighbors disagree) instead of no_service.
fill_unknown = true

# Frequency buckets, evaluated in order (smallest max_headway_min first).
# The first bucket where max_headway_min >= computed headway is used.
# max_headway_min = "inf" is the catch-all (matches any headway).
# color: 6-digit hex WITHOUT '#'.
# OMITTING color makes the bucket invisible (TOML has no null type): its line
# entries are removed from the output JSON, and edges that become empty are
# also removed entirely. Invisible routes do not appear in the transitmap
# output.
[[buckets]]
max_headway_min = 11
color = "#6D0F17"

[[buckets]]
max_headway_min = 13
color = "#D03838"

[[buckets]]
max_headway_min = 17
color = "#f57c00"

[[buckets]]
max_headway_min = 22
color = "#fbc02d"

[[buckets]]
max_headway_min = 32
color = "#388e3c"

[[buckets]]
max_headway_min = 70
color = "#1976d2"

[[buckets]]
max_headway_min = "inf"
color = "#9e9e9e"

# Routes with zero qualifying trips in the window.
# Omit color to make them invisible (removed from output).
[no_service]
color = "#cccccc"   # uncomment to render no-service routes in grey
